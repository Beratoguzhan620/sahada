# Serves the web app and forwards the API. One origin, so the browser needs no CORS.
upstream api {
    server api:8080;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    # Photos from the technician app are at most 5 MB.
    client_max_body_size 6m;

    location ~ ^/(api|scalar|openapi|health)(/|$) {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built files have content hashes in their names, so they can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The service worker must always be fresh, or a technician's phone could keep an old app.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Everything else is the single-page app. Text from the API is rendered as text; the policy is a second line of
    # defence: scripts and connections only from this origin, map tiles from OpenStreetMap, no framing. The camera is
    # for job photos.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; font-src 'self'; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }
}
